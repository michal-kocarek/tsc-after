allowBuilds:
  unrs-resolver: false

autoDedupe: true

hoist: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 1440

permissions:
  tsdown:
    skills: false

trustPolicy: no-downgrade

trustPolicyExcludePrune: true

update:
  githubActions: true
  ignoreDeps:
    - typescript
