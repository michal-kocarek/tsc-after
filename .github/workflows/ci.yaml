name: CI

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  pull_request: ~
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: prepare
        uses: ./.github/actions/prepare
      # Run every check even if an earlier one fails, so all problems are reported at once.
      - name: Dedupe Check
        if: &prepared ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
        run: pnpm dedupe --check
      - name: Format Check
        if: *prepared
        run: pnpm exec prettier --check .
      - name: Type Check
        if: *prepared
        run: pnpm typecheck
      - name: Lint Spelling
        if: *prepared
        run: pnpm lint:spelling
      - name: Lint Knip
        if: *prepared
        run: pnpm lint:knip
      - id: build
        name: Build
        if: *prepared
        run: pnpm build
      - name: Lint
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm lint

  # TypeScript tests its own Node.js compatibility upstream, so test our adapters
  # at the important edges rather than the full cross product. TypeScript 3.9–6.x
  # shares one API path, checked locally across 3.9–5.8; CI tests its endpoints.
  # Vitest runs on .nvmrc; tsc and tsc-after run on the selected Node.js.
  # Node.js 16.19/18.11 added util.parseArgs `default`. TypeScript 3.7 added
  # getOutputFileNames, 3.8 added watchOptions, and 3.9 is the oldest version
  # passing the suite unchanged (3.9.10 is the latest 3.9 patch).
  test:
    # matrix.os is linux (default) or windows, short for the check name.
    name: Test / ${{ matrix.os || 'linux' }} node/${{ matrix.node || 'default' }} typescript/${{ matrix.typescript || 'default' }}
    runs-on: ${{ matrix.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Locked TypeScript and default Node.js on both operating systems.
          - os: linux
          - os: windows
          # Locked TypeScript on the oldest Node.js 16; keep this axis in sync with engines.node.
          - node: 16.19.0
          # Locked TypeScript on the oldest supported Node.js 18.
          - node: 18.11.0
          # Locked TypeScript on the oldest supported Node.js 20.
          - node: 20.0.0
          # Locked TypeScript on the oldest supported Node.js 22.
          - node: 22.0.0
          # Locked TypeScript on the oldest supported Node.js 24.
          - node: 24.0.0
          # Locked TypeScript on the oldest supported Node.js 26.
          - node: 26.0.0
          # Oldest supported TypeScript on oldest Node.js; keep in sync with peerDependencies.
          - typescript: 3.9.10
            node: 16.19.0
          # TS7 adapter on the oldest Node.js where the 7.1 beta tsc runs.
          - typescript: 7.1.0-beta
            node: 22.0.0
          # TS7 adapter on the newest Node.js (.nvmrc).
          - typescript: 7.1.0-beta
          # TS7 adapter on Windows.
          - typescript: 7.1.0-beta
            os: windows
    env:
      TSC_AFTER_EXPECTED_NODE_VERSION: ${{ matrix.node || '' }}
      TSC_AFTER_EXPECTED_TYPESCRIPT_VERSION: ${{ matrix.typescript || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ matrix.node != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: ${{ matrix.node != '' }}
        name: Save compatibility Node executable
        run: echo "TSC_AFTER_NODE_EXECUTABLE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare
      # Build with the locked development dependencies before swapping TypeScript.
      - run: pnpm build
      - run: '"${TSC_AFTER_NODE_EXECUTABLE:-node}" bin/tsc-after.js --version'
      - name: Unit and end-to-end tests
        run: |
          tests=(bash -c 'pnpm run test:unit --run --coverage && pnpm run test:e2e --run')
          if [[ -n $TYPESCRIPT_VERSION ]]; then
            scripts/with-typescript-version "$TYPESCRIPT_VERSION" -- "${tests[@]}"
          else
            "${tests[@]}"
          fi
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
      # Every entry uploads, so Codecov merges coverage of version-specific branches.
      - if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Single stable job to mark as required in branch protection; add every new job to `needs`.
  gate:
    name: CI Gate
    if: always()
    needs:
      - check
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
