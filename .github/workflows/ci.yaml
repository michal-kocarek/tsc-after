name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: prepare
        uses: ./.github/actions/prepare
      # Run every check even if an earlier one fails, so all problems are reported at once.
      - name: Dedupe Check
        if: &prepared ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
        run: pnpm dedupe --check
      - name: Format Check
        if: *prepared
        run: pnpm exec prettier --check .
      - name: Type Check
        if: *prepared
        run: pnpm tsc
      - name: Lint Spelling
        if: *prepared
        run: pnpm lint:spelling
      - name: Lint Knip
        if: *prepared
        run: pnpm lint:knip
      - id: build
        name: Build
        if: *prepared
        run: pnpm build
      - name: Lint
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm run test:unit --run --coverage
      - if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - run: pnpm build
      - run: node bin/tsc-after.js --help
      - run: pnpm run test:e2e --run

  node_compatibility:
    name: Node.js ${{ matrix.node }} Compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep the lowest versions in sync with `engines.node` in package.json
        node:
          - 16.19.0
          - 18.11.0
          - 20.0.0
          - 22.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node bin/tsc-after.js --version
      - run: node bin/tsc-after.js --help
      - run: node bin/tsc-after.js --dry

  # Single stable job to mark as required in branch protection; add every new job to `needs`.
  gate:
    name: CI Gate
    if: always()
    needs:
      - check
      - node_compatibility
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
