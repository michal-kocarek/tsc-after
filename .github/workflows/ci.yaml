name: CI

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  pull_request: ~
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: prepare
        uses: ./.github/actions/prepare
      # Run every check even if an earlier one fails, so all problems are reported at once.
      - name: Dedupe Check
        if: &prepared ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
        run: pnpm dedupe --check
      - name: Format Check
        if: *prepared
        run: pnpm exec prettier --check .
      - name: Type Check
        if: *prepared
        run: pnpm typecheck
      - name: Lint Spelling
        if: *prepared
        run: pnpm lint:spelling
      - name: Lint Knip
        if: *prepared
        run: pnpm lint:knip
      - id: build
        name: Build
        if: *prepared
        run: pnpm build
      - name: Upload build
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
      - name: Lint
        if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        run: pnpm lint

  # TypeScript tests its own Node.js compatibility upstream, so test our adapters
  # at the important edges rather than the full cross product. TypeScript 3.9–6.x
  # shares one API path, checked locally across 3.9–5.8; CI tests its endpoints.
  # Vitest runs on .nvmrc; tsc and tsc-after run on the selected Node.js.
  # Node.js 16.19/18.11 added util.parseArgs `default`. TypeScript 3.7 added
  # getOutputFileNames, 3.8 added watchOptions, and 3.9 is the oldest version
  # passing the suite unchanged (3.9.10 is the latest 3.9 patch).
  test:
    # matrix.os is linux (default) or windows, short for the check name.
    name: Test / ${{ matrix.os || 'linux' }}, node ${{ matrix.node || 'default' }}, ts ${{ matrix.typescript || 'default' }}
    runs-on: ${{ matrix.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    env:
      TEST_RESULTS_DIR: ${{ github.workspace }}/.tmp/ci
      TSC_AFTER_EXPECTED_NODE_VERSION: ${{ matrix.node || '' }}
      TSC_AFTER_EXPECTED_TYPESCRIPT_VERSION: ${{ matrix.typescript || '' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Locked TypeScript and default Node.js on both operating systems.
          - os: linux
          - os: windows
          # Locked TypeScript on the oldest Node.js 16; keep this axis in sync with engines.node.
          - node: 16.19.0
          # Locked TypeScript on the oldest supported Node.js 18.
          - node: 18.11.0
          # Locked TypeScript on the oldest supported Node.js 20.
          - node: 20.0.0
          # Locked TypeScript on the oldest supported Node.js 22.
          - node: 22.0.0
          # Locked TypeScript on the oldest supported Node.js 24.
          - node: 24.0.0
          # Locked TypeScript on the oldest supported Node.js 26.
          - node: 26.0.0
          # Oldest supported TypeScript on oldest Node.js; keep in sync with peerDependencies.
          - typescript: 3.9.10
            node: 16.19.0
          # TS7 adapter on the oldest Node.js where the 7.1 beta tsc runs.
          - typescript: 7.1.0-beta
            node: 22.0.0
          # TS7 adapter on the newest Node.js (.nvmrc).
          - typescript: 7.1.0-beta
          # TS7 adapter on Windows.
          - typescript: 7.1.0-beta
            os: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ matrix.node != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - if: ${{ matrix.node != '' }}
        name: Save compatibility Node executable
        run: echo "TSC_AFTER_NODE_EXECUTABLE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/prepare
      # Keep the locked build for the version check; the helper builds its snapshot separately.
      - run: pnpm build
      - run: '"${TSC_AFTER_NODE_EXECUTABLE:-node}" bin/tsc-after.js --version'
      - name: Unit and end-to-end tests
        run: |
          tests=(bash -c 'pnpm run test:unit --run --coverage --coverage.reportsDirectory="$GITHUB_WORKSPACE/coverage" && pnpm run test:e2e --run')
          if [[ -n $TYPESCRIPT_VERSION ]]; then
            scripts/with-typescript-version "$TYPESCRIPT_VERSION" -- "${tests[@]}"
          else
            "${tests[@]}"
          fi
        env:
          TYPESCRIPT_VERSION: ${{ matrix.typescript }}
      - name: Capture environment
        if: failure()
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          node --input-type=module <<'EOF' | tee "$TEST_RESULTS_DIR/environment.json"
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";
          import path from "node:path";

          function getRealpaths(filePath) {
            const result = {};
            for (const [name, realpath] of [
              ["javascript", fs.realpathSync],
              ["native", fs.realpathSync.native],
            ]) {
              try {
                result[name] = realpath(filePath);
              } catch (error) {
                result[name] = { error: error.message };
              }
            }
            return result;
          }

          function getDiskSpace(dirPath) {
            try {
              const { bavail, bsize, blocks } = fs.statfsSync(dirPath);
              return {
                availableBytes: bavail * bsize,
                totalBytes: blocks * bsize,
              };
            } catch (error) {
              return { error: error.message };
            }
          }

          function isCaseInsensitive(dirPath) {
            let probeDir;
            try {
              probeDir = fs.mkdtempSync(path.join(dirPath, ".ci-case-probe-"));
              const filePath = path.join(probeDir, "CaseProbe");
              fs.writeFileSync(filePath, "");
              return fs.existsSync(path.join(probeDir, "caseprobe"));
            } catch (error) {
              return { error: error.message };
            } finally {
              if (probeDir) {
                fs.rmSync(probeDir, { recursive: true, force: true });
              }
            }
          }

          const cpus = os.cpus();
          const tscAfterNodeExecutable =
            process.env.TSC_AFTER_NODE_EXECUTABLE || process.execPath;
          let tscAfterNodeVersion;
          try {
            tscAfterNodeVersion = execFileSync(
              tscAfterNodeExecutable,
              ["--version"],
              { encoding: "utf8" },
            ).trim();
          } catch (error) {
            tscAfterNodeVersion = { error: error.message };
          }

          let installedTypeScriptVersion;
          try {
            installedTypeScriptVersion = JSON.parse(
              fs.readFileSync(
                path.join(process.cwd(), "node_modules", "typescript", "package.json"),
                "utf8",
              ),
            ).version;
          } catch (error) {
            installedTypeScriptVersion = { error: error.message };
          }

          const tmpDir = os.tmpdir();
          const report = {
            capturedAt: new Date().toISOString(),
            runner: {
              name: process.env.RUNNER_NAME,
              os: process.env.RUNNER_OS,
              arch: process.env.RUNNER_ARCH,
              imageOS: process.env.ImageOS,
              imageVersion: process.env.ImageVersion,
              temp: process.env.RUNNER_TEMP,
              workspace: process.env.GITHUB_WORKSPACE,
            },
            node: {
              runtimeVersion: process.version,
              runtimeExecutable: process.execPath,
              matrixVersion: process.env.TSC_AFTER_EXPECTED_NODE_VERSION || "default",
              tscAfterExecutable: tscAfterNodeExecutable,
              tscAfterVersion: tscAfterNodeVersion,
            },
            typescript: {
              matrixVersion:
                process.env.TSC_AFTER_EXPECTED_TYPESCRIPT_VERSION || "default",
              installedVersion: installedTypeScriptVersion,
            },
            worker: {
              availableParallelism: os.availableParallelism(),
              cpuCount: cpus.length,
              cpuModels: [...new Set(cpus.map(({ model }) => model))],
              totalMemoryBytes: os.totalmem(),
              freeMemoryBytes: os.freemem(),
              loadAverage: os.loadavg(),
              uptimeSeconds: os.uptime(),
              diskSpace: {
                workspace: getDiskSpace(process.cwd()),
                tmpDir: getDiskSpace(tmpDir),
              },
            },
            paths: {
              cwd: process.cwd(),
              tmpDir,
              temp: process.env.TEMP,
              tmp: process.env.TMP,
              tmpDirRealpaths: getRealpaths(tmpDir),
              caseInsensitive: {
                workspace: isCaseInsensitive(process.cwd()),
                tmpDir: isCaseInsensitive(tmpDir),
              },
            },
          };

          console.log(JSON.stringify(report, null, 2));
          EOF
      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os || 'linux' }}-node-${{ matrix.node || 'default' }}-typescript-${{ matrix.typescript || 'default' }}
          path: ${{ env.TEST_RESULTS_DIR }}
          retention-days: 1
          if-no-files-found: ignore
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os || 'linux' }}-node-${{ matrix.node || 'default' }}-typescript-${{ matrix.typescript || 'default' }}
          path: ${{ github.workspace }}/coverage/lcov.info
          retention-days: 1
          if-no-files-found: ignore

  # Single stable job to mark as required in branch protection; add every new job to `needs`, except codecov.
  gate:
    name: CI Gate
    if: always()
    needs:
      - check
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

  codecov:
    name: Codecov
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/prepare
      - name: Download coverage
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: .tmp/codecov/coverage
      - name: Download test results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-*
          path: .tmp/codecov/test-results
      - id: download-dist
        name: Download build
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: .tmp/codecov/coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: .tmp/codecov/test-results
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Bundle analysis
        if: ${{ steps.download-dist.outcome == 'success' }}
        continue-on-error: true
        run: pnpm exec bundle-analyzer dist --bundle-name=tsc-after --upload-token="$CODECOV_TOKEN"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
