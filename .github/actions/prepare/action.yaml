description: Prepares the repo for a typical CI job

name: Prepare

inputs:
  cache:
    description: Cache pnpm dependencies and runtime.
    default: "true"

runs:
  steps:
    # Keep this composite-action directory in .github/dependabot.yaml's github-actions directories.
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: ${{ inputs.cache }}
        require-lockfile: true
  using: composite
