updates:
  - # Keep this cooldown in sync with minimumReleaseAge in pnpm-workspace.yaml.
    commit-message:
      include: scope
      prefix: chore
    cooldown:
      default-days: 7
    directory: /
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Keep this ignore in sync with update.ignoreDeps in pnpm-workspace.yaml.
      # TypeScript stays locked until 7.1 is released publicly.
      - dependency-name: typescript
    package-ecosystem: npm
    schedule:
      interval: weekly
  - # Include composite actions; Dependabot does not scan them from / by default.
    commit-message:
      include: scope
      prefix: chore
    directories:
      - /
      - /.github/actions/*
    groups:
      github-actions:
        patterns:
          - "*"
    package-ecosystem: github-actions
    schedule:
      interval: weekly
version: 2
